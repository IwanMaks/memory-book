services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memorybook
      POSTGRES_PASSWORD: memorybook
      POSTGRES_DB: memorybook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorybook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
